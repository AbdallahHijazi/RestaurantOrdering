<p class="table-confirm-modal__meta">
  <strong>{{ tableName() }}</strong>
</p>
<p class="table-confirm-modal__message">{{ locale.uiText(messageKey()) }}</p>

@if (errorMessage(); as message) {
  <p class="table-confirm-modal__error" role="alert">{{ message }}</p>
}

<app-staff-modal-actions orderModalFooter>
  <!-- High-impact confirmation: the action text stays visible next to the icon. -->
  <button
    appIconButton
    icon="check"
    [variant]="destructive() ? 'danger' : 'primary'"
    [showLabel]="true"
    data-testid="table-confirm-submit"
    [label]="locale.uiText(confirmKey())"
    [loading]="submitting()"
    [disabled]="submitting()"
    (click)="confirmed.emit()"
  ></button>
  <button
    appIconButton
    icon="x"
    [label]="locale.uiText('tablesCancel')"
    (click)="cancelled.emit()"
  ></button>
</app-staff-modal-actions>
