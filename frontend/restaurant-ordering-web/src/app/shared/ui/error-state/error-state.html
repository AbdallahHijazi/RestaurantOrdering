<section class="error-state" role="alert">
  <h2>{{ resolveTitle(locale(), title()) }}</h2>
  <p>{{ resolveMessage(locale(), message()) }}</p>
  @if (showRetry()) {
    <button
      appIconButton
  class="error-state__retry"
      icon="refresh"
      [label]="locale()?.locale() === 'ar' ? 'إعادة المحاولة' : 'Try again'"
      (click)="retry.emit()"
    ></button>
  }
</section>
